spring.config.import=optional:file:.env[.properties]

# Conexão com o banco
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:titureco}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:sua_senha_segura}
spring.datasource.driver-class-name=org.postgresql.Driver

# Proxy / Forwarded Headers
server.forward-headers-strategy=native

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:missing

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

# JWT
jwt.secret=${JWT_SECRET}
# Expiração do Access Token: 900000ms = 15 minutos
jwt.expiration-ms=${JWT_EXPIRATION:900000}
# Expiração do Refresh Token: 604800000ms = 7 dias
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Rate Limiting
rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:100}
rate-limit.refill-duration-minutes=${RATE_LIMIT_REFILL_MINUTES:1}

# Admin Seed
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Observabilidade (Actuator)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized