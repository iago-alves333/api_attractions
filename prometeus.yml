global:
  scrape_interval: 15s # O Prometheus vai bater na sua API a cada 15 segundos

scrape_configs:
  - job_name: 'titureco-spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal aponta para a porta 8080 do seu Spring Boot rodando localmente (fora do Docker)
      - targets: ['host.docker.internal:8080']