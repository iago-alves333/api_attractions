name: Titureco CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest # Roda em uma máquina virtual Linux do GitHub

    steps:
      # Passo 1: Baixar o seu código para a máquina virtual
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Instalar o Java
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Passo 3: Rodar os testes do Mockito
      - name: Build e Testes
        run: mvn clean test